[package]
name = "ai-inference-server-rust"
version = "0.1.0"
edition = "2021"
authors = ["Alisha Karma <https://alishakarma.com>"]
homepage = "https://alishakarma.com"

[[bin]]
name = "server"
path = "src/bin/server.rs"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
axum-test = "20"
tokio = { version = "1", features = ["full"] }
