[package]
name = "ai-inference-server-rust"
version = "0.1.0"
edition = "2021"
authors = ["Alisha Karma <lishykarma99@gmail.com>"]
homepage = "https://github.com/codealisha99/ai-inference-layer"
repository = "https://github.com/codealisha99/ai-inference-layer"

[[bin]]
name = "server"
path = "src/bin/server.rs"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
axum-test = "15"
tokio = { version = "1", features = ["full"] }
